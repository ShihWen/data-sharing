table_id: "inter_city_bus_stop_of_route"
description: "table containing city bus station information from TDX API."
labels:
  data_source: "tdx"
  data_type: "bus"
  tier: "silver"
  granularity: "bus"

schema:   
    - {name: 'route_uid', type: 'STRING', mode: 'REQUIRED'}
    - {name: 'route_id', type: 'STRING', mode: 'REQUIRED'}
    - {name: 'route_name', type: 'RECORD', mode: 'REQUIRED', 'fields': [
        {name: 'zh_tw', type: 'STRING', mode: 'REQUIRED'},
        {name: 'en', type: 'STRING', mode: 'NULLABLE'},
    ]}
    - {name: 'operators', type: 'RECORD', mode: 'REPEATED', 'fields': [
        {name: 'operator_id', type: 'STRING', mode: 'REQUIRED'},
        {name: 'operator_name', type: 'RECORD', mode: 'REQUIRED', 'fields': [
            {name: 'zh_tw', type: 'STRING', mode: 'REQUIRED'},
            {name: 'en', type: 'STRING', mode: 'NULLABLE'},
        ]},
        {name: 'operator_code', type: 'STRING', mode: 'NULLABLE'},
        {name: 'operator_no', type: 'STRING', mode: 'NULLABLE'},
    ]}
    - {name: 'sub_route_uid', type: 'STRING', mode: 'REQUIRED'}
    - {name: 'sub_route_id', type: 'STRING', mode: 'REQUIRED'}
    - {name: 'sub_route_name', type: 'RECORD', mode: 'REQUIRED', 'fields': [
        {name: 'zh_tw', type: 'STRING', mode: 'REQUIRED'},
        {name: 'en', type: 'STRING', mode: 'NULLABLE'},
    ]}
    - {name: 'direction', type: 'STRING', mode: 'NULLABLE'}
    - {name: 'stops', type: 'RECORD', mode: 'REPEATED', 'fields': [
        {name: 'stop_uid', type: 'STRING', mode: 'REQUIRED'},
        {name: 'stop_id', type: 'STRING', mode: 'REQUIRED'},
        {name: 'stop_name', type: 'RECORD', mode: 'REQUIRED', 'fields': [
            {name: 'zh_tw', type: 'STRING', mode: 'REQUIRED'},
            {name: 'en', type: 'STRING', mode: 'NULLABLE'},
        ]},
        {name: 'stop_boarding', type: 'INTEGER', mode: 'NULLABLE'},
        {name: 'stop_sequence', type: 'INTEGER', mode: 'NULLABLE'},
        {name: 'stop_position', type: 'RECORD', mode: 'REQUIRED', 'fields': [
            {name: 'position_lon', type: 'FLOAT', mode: 'REQUIRED'},
            {name: 'position_lat', type: 'FLOAT', mode: 'REQUIRED'},
            {name: 'geohash', type: 'STRING', mode: 'NULLABLE'},
        ]},
        {name: 'station_id', type: 'STRING', mode: 'NULLABLE'},
        {name: 'station_group_id', type: 'STRING', mode: 'NULLABLE'},
    ]}
    - {name: 'update_time', type: 'TIMESTAMP', mode: 'NULLABLE'}
    - {name: 'version_id', type: 'INTEGER', mode: 'NULLABLE'}
    - {name: 'processed_at', type: 'TIMESTAMP', mode: 'NULLABLE'}
    - {name: 'valid_from_ts', type: 'TIMESTAMP', mode: 'NULLABLE'}
    - {name: 'valid_to_ts', type: 'TIMESTAMP', mode: 'NULLABLE'}
    - {name: 'is_current', type: 'BOOLEAN', mode: 'NULLABLE'}

