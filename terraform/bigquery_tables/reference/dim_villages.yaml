table_id: dim_villages
friendly_name: "Dimension: Villages"
description: "SCD Type 2 table for administrative villages in Taiwan. Contains village code, names, and boundary geometry."
labels:
  environment: "development"
  domain: "reference"
  data_tier: "silver"
  owner: "data_engineering"
schema:
  - name: "village_code"
    type: "STRING"
    mode: "REQUIRED"
    description: "The unique identifier for the village (e.g., '09007010001'). This is the natural key."
  - name: "village_name_zh"
    type: "STRING"
    mode: "NULLABLE"
    description: "The traditional Chinese name of the village (e.g., '介壽村')."
  - name: "town_code"
    type: "STRING"
    mode: "NULLABLE"
    description: "The unique identifier for the town/district the village belongs to. Foreign key to dim_towns."
  - name: "town_name_zh"
    type: "STRING"
    mode: "NULLABLE"
    description: "The traditional Chinese name of the town/district the village belongs to."
  - name: "city_name_en"
    type: "STRING"
    mode: "NULLABLE"
    description: "The English name of the city the village belongs to. Foreign key to dim_cities."
  - name: "city_name_zh"
    type: "STRING"
    mode: "NULLABLE"
    description: "The traditional Chinese name of the city the village belongs to."
  - name: "geometry"
    type: "GEOGRAPHY"
    mode: "NULLABLE"
    description: "The boundary geometry of the village."
  - name: "update_date"
    type: "TIMESTAMP"
    mode: "NULLABLE"
    description: "The date the source data was last updated."
  - name: "check_date"
    type: "TIMESTAMP"
    mode: "NULLABLE"
    description: "The date the source data was last checked."
  - name: "processed_at"
    type: "TIMESTAMP"
    mode: "NULLABLE"
    description: "Silver layer processing timestamp."
  - name: "valid_from_ts"
    type: "TIMESTAMP"
    mode: "NULLABLE"
    description: "The timestamp when this version of the record became valid."
  - name: "valid_to_ts"
    type: "TIMESTAMP"
    mode: "NULLABLE"
    description: "The timestamp when this version of the record expired. A future date indicates the current version."
  - name: "is_current"
    type: "BOOLEAN"
    mode: "NULLABLE"
    description: "Flag to easily identify the current version of the record (TRUE for current)." 