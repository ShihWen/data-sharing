table_id: dim_towns
friendly_name: "Dimension: Towns"
description: "SCD Type 2 table for administrative towns/districts in Taiwan. Contains town code, names, and boundary geometry."
labels:
  environment: "development"
  domain: "reference"
  data_tier: "silver"
  owner: "data_engineering"
schema:
  - name: "town_code"
    type: "STRING"
    mode: "REQUIRED"
    description: "The unique identifier for the town/district (e.g., '09007030'). This is the natural key."
  - name: "town_name_zh"
    type: "STRING"
    mode: "NULLABLE"
    description: "The traditional Chinese name of the town/district (e.g., '莒光鄉')."
  - name: "city_name_en"
    type: "STRING"
    mode: "NULLABLE"
    description: "The English name of the city the town belongs to. Foreign key to dim_cities."
  - name: "city_name_zh"
    type: "STRING"
    mode: "NULLABLE"
    description: "The traditional Chinese name of the city the town belongs to."
  - name: "geometry"
    type: "GEOGRAPHY"
    mode: "NULLABLE"
    description: "The boundary geometry of the town."
  - name: "update_date"
    type: "TIMESTAMP"
    mode: "NULLABLE"
    description: "The date the source data was last updated."
  - name: "check_date"
    type: "TIMESTAMP"
    mode: "NULLABLE"
    description: "The date the source data was last checked."
  - name: "processed_at"
    type: "TIMESTAMP"
    mode: "NULLABLE"
    description: "Silver layer processing timestamp."
  - name: "valid_from_ts"
    type: "TIMESTAMP"
    mode: "NULLABLE"
    description: "The timestamp when this version of the record became valid."
  - name: "valid_to_ts"
    type: "TIMESTAMP"
    mode: "NULLABLE"
    description: "The timestamp when this version of the record expired. A future date indicates the current version."
  - name: "is_current"
    type: "BOOLEAN"
    mode: "NULLABLE"
    description: "Flag to easily identify the current version of the record (TRUE for current)." 