dataset_id: reference
table_id: dim_districts
friendly_name: "Dimension: Districts"
description: "SCD Type 2 table for administrative districts in Taiwan. Contains district code, names, and boundary geometry."
schema:
  - name: "district_code"
    type: "STRING"
    mode: "REQUIRED"
    description: "The unique identifier for the district (e.g., '09007030'). This is the natural key."
  - name: "district_name_zh"
    type: "STRING"
    mode: "NULLABLE"
    description: "The traditional Chinese name of the district (e.g., '莒光鄉')."
  - name: "city_name_en"
    type: "STRING"
    mode: "NULLABLE"
    description: "The English name of the city the district belongs to. Foreign key to dim_cities."
  - name: "city_name_zh"
    type: "STRING"
    mode: "NULLABLE"
    description: "The traditional Chinese name of the city the district belongs to."
  - name: "geometry"
    type: "GEOGRAPHY"
    mode: "NULLABLE"
    description: "The boundary geometry of the district."
  - name: "update_date"
    type: "TIMESTAMP"
    mode: "NULLABLE"
    description: "The date the source data was last updated."
  - name: "check_date"
    type: "TIMESTAMP"
    mode: "NULLABLE"
    description: "The date the source data was last checked."
  - name: "processed_at"
    type: "TIMESTAMP"
    mode: "NULLABLE"
    description: "Silver layer processing timestamp."
  - name: "valid_from_ts"
    type: "TIMESTAMP"
    mode: "NULLABLE"
    description: "The timestamp when this version of the record became valid."
  - name: "valid_to_ts"
    type: "TIMESTAMP"
    mode: "NULLABLE"
    description: "The timestamp when this version of the record expired. A future date indicates the current version."
  - name: "is_current"
    type: "BOOLEAN"
    mode: "NULLABLE"
    description: "Flag to easily identify the current version of the record (TRUE for current)." 