table_id: "dim_cities"
description: "Dimension table containing the official administrative boundaries and names for cities in Taiwan. Tracks historical changes (SCD Type 2)."
labels:
  data_source: "tdx"
  data_type: "boundaries"
  tier: "silver"
  granularity: "city"

schema:
  - {name: "city_name_en", type: "STRING", mode: "REQUIRED", description: "The English identifier for the city (e.g., 'LienchiangCounty'). This is the natural key."}
  - {name: "city_name_zh", type: "STRING", mode: "NULLABLE", description: "The traditional Chinese name of the city (e.g., '連江縣')."}
  - {name: "geometry", type: "GEOGRAPHY", mode: "NULLABLE", description: "The MultiPolygon geometry representing the boundary of the city."}
  - {name: "update_date", type: "TIMESTAMP", mode: "NULLABLE", description: "The date the source data was last updated. Used to detect changes."}
  - {name: "check_date", type: "TIMESTAMP", mode: "NULLABLE", description: "The date the source data was last checked."}
  - {name: "processed_at", type: "TIMESTAMP", mode: "NULLABLE", description: "The timestamp when the record was processed into the Silver layer."}
  - {name: "valid_from_ts", type: "TIMESTAMP", mode: "NULLABLE", description: "The timestamp when this version of the record became valid."}
  - {name: "valid_to_ts", type: "TIMESTAMP", mode: "NULLABLE", description: "The timestamp when this version of the record expired. A future date indicates the current version."}
  - {name: "is_current", type: "BOOLEAN", mode: "NULLABLE", description: "Flag to easily identify the current version of the record (TRUE for current)."} 