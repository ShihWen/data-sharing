  - id: "tpe_mrt_bronze"
    friendly_name: "Taipei MRT Bronze"
    description: "Raw data from Taipei MRT including traffic, station, and exit information"
    labels:
      environment: "development"
      domain: "tpe_mrt"
      data_tier: "bronze"
      owner: "data_engineering"
    access_rules:
      # Project owners always have access
      - role: "OWNER"
        special_group: "projectOwners"
      
      # Project writers have write access
      - role: "WRITER"
        special_group: "projectWriters"
      
      # Project readers have read access
      - role: "READER"
        special_group: "projectReaders"

  - id: "tpe_mrt_silver"
    friendly_name: "Taipei MRT Silver"
    description: "Cleaned and validated Taipei MRT data"
    labels:
      environment: "development"
      domain: "tpe_mrt"
      data_tier: "silver"
      owner: "data_engineering"
    access_rules:
      - role: "OWNER"
        special_group: "projectOwners"
      - role: "WRITER"
        special_group: "projectWriters"
      - role: "READER"
        special_group: "projectReaders"

  - id: "tpe_mrt_gold"
    friendly_name: "Taipei MRT Gold"
    description: "Analytics-ready Taipei MRT data for business consumption"
    labels:
      environment: "development"
      domain: "tpe_mrt"
      data_tier: "gold"
      owner: "data_engineering"
    access_rules:
      - role: "OWNER"
        special_group: "projectOwners"
      - role: "WRITER"
        special_group: "projectWriters"
      - role: "READER"
        special_group: "projectReaders"

  - id: "general"
    friendly_name: "General purpose dataset"
    description: "For storing general purpose data such as Calendar, Holidays, etc."
    labels:
      environment: "development"
      domain: "general"
      data_tier: "general"
      owner: "data_engineering"
    access_rules:
      - role: "OWNER"
        special_group: "projectOwners"
      - role: "WRITER"
        special_group: "projectWriters"
      - role: "READER"
        special_group: "projectReaders"

  - id: "workspace"
    friendly_name: "workspace"
    description: "For testing and development purposes, or temporary data storage"
    labels:
      environment: "development"
      domain: "workspace"
      data_tier: "none"
      owner: "data_engineering"
    access_rules:
      - role: "OWNER"
        special_group: "projectOwners"
      - role: "WRITER"
        special_group: "projectWriters"
      - role: "READER"
        special_group: "projectReaders"

  - id: "osm_silver"
    friendly_name: "OSM Silver"
    description: "Cleaned and validated data from OpenStreetMap"
    labels:
      environment: "development"
      domain: "osm"
      data_tier: "silver"
      owner: "data_engineering"
    access_rules:
      - role: "OWNER"
        special_group: "projectOwners"
      - role: "WRITER"
        special_group: "projectWriters"
      - role: "READER"
        special_group: "projectReaders"

  - id: "osm_gold"
    friendly_name: "OSM Gold"
    description: "Analytics-ready OpenStreetMap data for business consumption"
    labels:
      environment: "development"
      domain: "osm"
      data_tier: "gold"
      owner: "data_engineering"
    access_rules:
      - role: "OWNER"
        special_group: "projectOwners"
      - role: "WRITER"
        special_group: "projectWriters"
      - role: "READER"
        special_group: "projectReaders"
